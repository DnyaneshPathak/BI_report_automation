[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-report-automation"
version = "2.0.0"
description = "Local Excel-to-Power-BI analytics dashboard — 100% offline, no cloud"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
    "jinja2>=3.1,<4",
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<1",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "pyarrow>=15,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.4",
    "black>=24",
    "pip-audit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
